[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "aris-mcp"
version = "1.0.0"
description = "Software AG ARIS REST API + MCP Server + A2A Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-utilities>=2.0.0", "requests>=2.34.2",]
[[project.authors]]
name = "Audel Rouhi"
email = "knucklessg1@gmail.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-utilities[mcp]>=2.0.0",]
agent = [ "agent-utilities[agent-runtime,logfire]>=2.0.0",]
all = [ "agent-utilities[mcp,agent-runtime,logfire]>=2.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
aris-mcp = "aris_mcp.mcp_server:mcp_server"
aris-agent = "aris_mcp.agent_server:agent_server"

[project.entry-points."agent_utilities.skill_providers"]
aris-mcp = "aris_mcp.skills"

[project.entry-points."agent_utilities.ontology_providers"]
aris-mcp = "aris_mcp.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
aris-mcp = "aris_mcp.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
aris-mcp = "aris_mcp.prompts"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
aris_mcp = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

# Minimal residue for a2a.json generation (CONCEPT:AU-KG.ontology.a2a-card-generation,
# D-OB-1): everything else in a2a.json is derived from this file's [project] table
# by agent-utilities' generate_connector_manifests.py — a2a.json itself is a
# generated artifact, never hand-edited. This agent-facing description is more
# specific than [project].description (a packaging blurb) and has no other
# canonical source, so it is declared here instead of being lost.
[tool.a2a]
description = "Software AG ARIS agent: model inventory, EPC objects/connections, attribute read and (gated) write over the ARIS REST API."
