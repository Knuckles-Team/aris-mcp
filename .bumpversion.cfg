[bumpversion]
current_version = 1.3.2
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(compose-img-tag):docker/mcp.compose.yml]
search = knucklessg1/aris-mcp:{current_version}
replace = knucklessg1/aris-mcp:{new_version}

[bumpversion:file(readme-img-tag):README.md]
search = knucklessg1/aris-mcp:{current_version}
replace = knucklessg1/aris-mcp:{new_version}

[bumpversion:file(readme-img-tag-short):README.md]
search = `:{current_version}`
replace = `:{new_version}`

[bumpversion:file:aris_mcp/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file(docker-img):docker/Dockerfile]
search = =={current_version}"
replace = =={new_version}"
